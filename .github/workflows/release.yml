name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check manifest version matches tag
        run: |
          version=$(jq -r .version custom_components/cisco_roomos/manifest.json)
          test "v${version}" = "${GITHUB_REF_NAME}" || {
            echo "manifest.json has ${version}, tag is ${GITHUB_REF_NAME}"; exit 1; }
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes --title "${GITHUB_REF_NAME}"
